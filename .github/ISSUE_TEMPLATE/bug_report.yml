name: Bug report
description: Report a reproducible problem in CasterLiveAutomation
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Privacy reminder:** Never upload real INI files, unredacted logs, credentials, or personal machine paths. If the issue involves SEND, verify the actual stream state before retrying.
  - type: input
    id: version
    attributes:
      label: CasterLiveAutomation version
      placeholder: "1.0 candidate"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows and AutoHotkey versions
      placeholder: "Windows 11, AutoHotkey v2.x, display scaling 125%"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Scheduler / recurring days / exceptions
        - START or CLOSE sequence
        - Minimized window / wrong click target
        - UI / localization
        - Installation / startup
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Describe the steps without including personal data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Actual behavior and redacted log excerpts
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Safety checks
      options:
        - label: I removed private paths, usernames, credentials and schedule data from the report.
          required: true
        - label: I checked the actual SEND state before retrying the automation (if relevant).
          required: false
