name: Feature request
description: Suggest a new workflow or improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What task is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Scheduling
        - Action sequences
        - Window/click safety
        - UI/localization
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Safety impact
      description: Could this affect SEND, CLOSE or overlapping schedules?
