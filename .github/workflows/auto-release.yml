name: Automatic Windows stable release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: caster-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Verify version and publication state
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
      tag: ${{ steps.gate.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check release/tag consistency
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          echo "publish=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == branch && "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "Not the default branch; no release."
            exit 0
          fi
          version="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION must have the form X.Y"
            exit 1
          fi
          tag="v${version}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "::error::Pushed tag '$GITHUB_REF_NAME' does not match VERSION '$tag'"
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists. Nothing to overwrite; existing prereleases must be promoted manually after checking their assets and commit."
            exit 0
          fi
          # Never move a previously published tag to a different commit.
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" | grep -q .; then
            git fetch --no-tags origin "refs/tags/$tag:refs/tags/$tag"
            tagged_commit="$(git rev-list -n 1 "refs/tags/$tag")"
            source_commit="$(git rev-parse HEAD)"
            if [[ "$tagged_commit" != "$source_commit" ]]; then
              echo "::error::Tag $tag already points to $tagged_commit, not $source_commit. Bump VERSION or release the tagged commit."
              exit 1
            fi
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "Eligible: stable release $tag for $(git rev-parse HEAD)"

  build-and-publish:
    name: Test, build and publish stable release (Windows)
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install AutoHotkey v2
        shell: pwsh
        run: |
          choco install autohotkey.install --version=2.0.28 -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'AutoHotkey v2 install failed' }
          $ahk = Join-Path $env:ProgramFiles 'AutoHotkey\v2\AutoHotkey64.exe'
          if (-not (Test-Path $ahk)) { throw "Missing x64 AutoHotkey v2: $ahk" }
      - name: Install official Ahk2Exe compiler (verified archive)
        shell: pwsh
        run: .\scripts\Install-Ahk2Exe.ps1
      - name: Run Windows calendar tests (no GUI/Caster integration)
        shell: pwsh
        run: |
          .\scripts\Run-WindowsCalendarTests.ps1
      - name: Compile and package Windows executables
        shell: pwsh
        run: .\scripts\Build-Windows.ps1
      - name: Publish GitHub stable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          $version = (Get-Content 'VERSION' -Raw).Trim()
          $zip = "dist/CasterLiveAutomation-$version-Windows-x64.zip"
          $sha = "$zip.sha256"
          foreach ($path in @($zip, $sha)) {
            if (-not (Test-Path $path)) { throw "Missing release asset: $path" }
          }
          $notes = 'CasterLiveAutomation stable release. Includes the Windows GUI and separate Worker executable. Automated source checks, AutoHotkey calendar tests and compilation run in CI. These checks cannot verify real CasterLive DJ playback, GUI focus or complete START/CLOSE behavior; test the setup under supervision before unattended use. Future updates may be published as needed.'
          $title = "CasterLiveAutomation $version"
          $args = @('release', 'create', $env:RELEASE_TAG, $zip, $sha,
                    '--title', $title, '--notes', $notes, '--generate-notes',
                    '--latest')
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $args += '--verify-tag'
          } else {
            # gh creates the new tag at this exact source commit.
            $args += @('--target', $env:GITHUB_SHA)
          }
          & gh @args
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish GitHub stable release $env:RELEASE_TAG" }
          Write-Host "Published stable release $env:RELEASE_TAG. Real CasterLive DJ integration is not verified by CI."
