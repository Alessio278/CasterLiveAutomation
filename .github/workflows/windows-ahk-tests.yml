name: Windows AutoHotkey calendar tests
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  windows-calendar:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install AutoHotkey v2
        shell: pwsh
        run: choco install autohotkey.install -y --no-progress
      - name: Run safe calendar tests
        shell: pwsh
        run: |
          .\scripts\Run-WindowsCalendarTests.ps1
